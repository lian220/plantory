<style>
  #plantory-concept .p-careflow{display:grid;gap:16px}
  #plantory-concept .p-careflow h2{font-size:19px;line-height:1.45}
  #plantory-concept .p-careflow h3{font-size:16px;line-height:1.5}
  #plantory-concept .p-careflow p{margin-top:8px}
  #plantory-concept .p-careflow .p-careflow-field{display:block;margin-top:16px;font-size:14px}
  #plantory-concept .p-careflow .p-careflow-field:first-child{margin-top:0}
  #plantory-concept .p-careflow textarea{resize:vertical;min-height:84px}
  #plantory-concept .p-careflow select,#plantory-concept .p-careflow input{min-width:0;max-width:100%}
  #plantory-concept .p-careflow-check{display:flex;align-items:center;gap:10px;min-height:48px;font-size:14px;padding:8px 0}
  #plantory-concept .p-careflow-check input{width:22px;height:22px;flex-shrink:0;accent-color:var(--p-accent)}
  #plantory-concept .p-careflow-dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;margin:18px 0 0;font-size:14px}
  #plantory-concept .p-careflow-dl dt{color:var(--p-muted)}
  #plantory-concept .p-careflow-dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  #plantory-concept .p-careflow-message{font-size:14px;color:var(--p-accent);margin-top:12px;white-space:pre-wrap}
  #plantory-concept .p-careflow-warning{border-left:3px solid var(--p-gold);padding:10px 12px;background:var(--p-soft);font-size:13px;color:var(--p-muted)}
  #plantory-concept .p-careflow-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  #plantory-concept .p-careflow-entry{padding:16px 0;border-top:1px solid var(--p-line)}
  #plantory-concept .p-careflow-entry[data-cancelled=true]{border-left:3px solid var(--p-line);padding-left:12px}
  #plantory-concept .p-careflow .p-actions{align-items:stretch}
  #plantory-concept .p-careflow .p-actions button{white-space:normal;overflow-wrap:anywhere}
  #plantory-concept .p-careflow .p-careflow-tag{display:inline-block;font-size:12px;color:var(--p-gold);padding:4px 0}
  #plantory-concept .p-careflow .p-careflow-filters{border-bottom:1px solid var(--p-line);padding-bottom:18px}
  #plantory-concept .p-careflow .p-careflow-outcome{margin-top:14px;padding:12px;background:var(--p-soft);border-radius:10px}
  #plantory-concept .p-careflow :is(h2,h3)[tabindex]:focus{outline:2px solid var(--p-accent);outline-offset:5px}
  @media(max-width:360px){#plantory-concept .p-careflow-dl{grid-template-columns:78px minmax(0,1fr);gap:8px}}
</style>
<script>
(() => {
  'use strict';
  const api=window.PlantoryPrototype;
  if(!api)return;
  const types={soil:'일반 흙 화분',hydro:'수경재배',terrarium:'테라리움',paludarium:'팔루다리움',unknown:'재배 방식 모름'};
  const origins={purchase:'구입',gift:'선물',transfer:'개인 분양·나눔'};
  const arrivalStates={same:'설명과 비슷해요',different:'다른 점이 있어요',unknown:'아직 모르겠어요'};
  const progressLabels={better:'나아져 보여요',similar:'비슷해 보여요',worse:'더 걱정돼요',unknown:'아직 모르겠어요'};
  const workLabels={consultation:'상담 내용을 직접 정리',repot:'분갈이',move:'자리 이동',other:'그 밖의 일·관찰 계획'};
  const photoLabels={none:'사진 없음',individual:'판매·분양할 실제 개체 사진',representative:'대표 이미지',parent:'모주 사진'};
  const rootedLabels={unknown:'모름',rooted:'뿌리가 있음',cutting:'삽수·뿌리 확인 전'};
  const potLabels={unknown:'모름',yes:'화분 포함',no:'화분 미포함'};
  const methodLabels={unknown:'아직 정하지 않음',shipping:'배송',meet:'지역 직거래',either:'배송·지역 직거래 모두 검토'};
  const arrivals=new Map(),followups=new Map(),transfers=new Map(),materialTransfers=new Map();
  let fieldId=0,planId=0;
  const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
  const copy=value=>JSON.parse(JSON.stringify(value));
  const clean=value=>String(value||'').trim();
  const validType=value=>Object.hasOwn(types,value)?value:'unknown';
  const plantTitle=p=>p.name+' · '+p.location+' · '+(types[p.type]||types.unknown);
  const selectedId=context=>context&&Object.hasOwn(context,'plantId')?(context.plantId||null):(api.getSelectedPlant()?.id||null);
  function text(parent,value,cls='p-small'){parent.append(node('p',cls,value));}
  function title(parent,value,level='h2'){const h=node(level,'',value);h.tabIndex=-1;parent.append(h);return h;}
  function box(host,heading){const b=node('article','p-box');if(heading)title(b,heading);host.append(b);return b;}
  function start(host){host.classList.add('p-stack','p-careflow');host.replaceChildren();}
  function button(label,fn,primary=false){const b=node('button',primary?'p-primary':'p-secondary',label);b.type='button';b.addEventListener('click',fn);return b;}
  function actions(parent,...buttons){const wrap=node('div','p-actions');wrap.append(...buttons);parent.append(wrap);return wrap;}
  function details(parent,rows){const dl=node('dl','p-careflow-dl');rows.forEach(([label,value])=>dl.append(node('dt','',label),node('dd','',value===undefined||value===''?'미확인':value)));parent.append(dl);return dl;}
  function field(parent,label,kind,value,change,options={}){
    const wrap=node('label','p-careflow-field',label),input=node(kind==='textarea'?'textarea':kind==='select'?'select':'input','p-input');
    input.id='p-careflow-field-'+(++fieldId);wrap.htmlFor=input.id;
    if(kind==='select')Object.entries(options.values||{}).forEach(([key,labelText])=>{const option=node('option','',labelText);option.value=key;input.append(option);});
    else if(kind!=='textarea')input.type=kind;
    if(kind==='textarea')input.rows=3;
    if(options.max)input.maxLength=options.max;
    if(options.placeholder)input.placeholder=options.placeholder;
    if(kind==='text')input.autocomplete='off';
    input.value=value||'';input.addEventListener(kind==='select'?'change':'input',()=>change(input.value));wrap.append(input);parent.append(wrap);
    if(options.note){const hint=node('p','p-fieldnote',options.note);hint.id=input.id+'-note';input.setAttribute('aria-describedby',hint.id);parent.append(hint);}
    return input;
  }
  function check(parent,label,value,change,disabled=false){const wrap=node('label','p-careflow-check'),input=node('input');input.type='checkbox';input.checked=value;input.disabled=disabled;input.addEventListener('change',()=>change(input.checked));wrap.append(input,node('span','',label));parent.append(wrap);return input;}
  function feedback(parent,value=''){const p=node('p','p-careflow-message',value);p.setAttribute('role','status');parent.append(p);return p;}
  function focus(nodeToFocus){if(!nodeToFocus)return;nodeToFocus.scrollIntoView({block:'start',behavior:'instant'});nodeToFocus.focus({preventScroll:true});}
  function timestamp(value){const date=new Date(value);return Number.isNaN(date.valueOf())?'시각 미확인':new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}
  function observationText(record,type){
    const labels={wet:'아직 젖어 있음',dry:'말라 있음',unknown:'모름',condensation:'결로가 보임',clear:'결로가 안 보임',changed:type==='paludarium'?'수위가 달라 보임':'변화가 보임',stable:type==='hydro'||type==='paludarium'?'평소와 비슷해 보임':'큰 변화는 없음'};
    return labels[record.status]||record.status||'상태 미확인';
  }
  function observations(id){return api.getObservations(id).filter(record=>!record.cancelled);}
  function currentObservation(parent,plant){const record=observations(plant.id).at(-1);text(parent,record?'최근 유효 관찰: '+observationText(record,plant.type)+' · '+timestamp(record.createdAt):'아직 유효한 관찰이 없어요. 계획을 정리한 뒤 현재 상태를 남겨도 돼요.');}
  function contextRows(id,key,rows){if(typeof api.setContext==='function')api.setContext(id,key,rows);}
  const won=value=>Number(value).toLocaleString('ko-KR')+'원';
  function offerCosts(purpose,price,shipping,method){
    const item=purpose==='free'?0:purpose==='paid'&&price!==''?Number(price):null;
    const delivery=shipping!==''?Number(shipping):null;
    let total='물품 금액과 수령 비용을 확인해야 해요.';
    if(method==='meet')total=item===null?'물품 금액 미확인 · 이동 비용은 별도':won(item)+' · 물품만, 직거래 이동 비용 별도';
    else if(method==='shipping'&&item!==null&&delivery!==null)total=won(item+delivery)+' · 입력한 물품값과 배송비 기준';
    else if(method==='shipping'&&item!==null)total=won(item)+' + 배송비 미확인';
    else if(item!==null)total=won(item)+' + 수령 방식·비용 확인 필요';
    return [['물품 희망 금액',item===null?'미확인':purpose==='free'?'0원 · 무료 나눔':won(item)+' · 판매 호가'],['배송비',method==='meet'?'직거래 · 배송 대상 아님':delivery===null?'미확인':won(delivery)+(method==='shipping'?'':' · 배송 선택 시')],['비교용 합계',total]];
  }
  function moneyInput(parent,label,value,change,note){const input=field(parent,label,'number',value,change,{placeholder:'미확인이면 비워두기',note});input.min='0';input.step='1';return input;}
  function validMoney(input,value){return !input.validity.badInput&&(value===''||(Number.isFinite(Number(value))&&Number(value)>=0&&Number.isInteger(Number(value))));}
  function plantPicker(parent,plantId,change,label='대상 식물'){
    const values={'':'식물을 골라 주세요'};api.getPlants().forEach(p=>{values[p.id]=(p.sample?'샘플 · ':'')+plantTitle(p);});
    const select=field(parent,label,'select',plantId||'',change,{values});if(plantId)select.querySelector('option[value=""]').disabled=true;return select;
  }
  function noPlant(host,id){const b=box(host,'먼저 대상 식물을 골라 주세요');text(b,'직접 등록한 식물이나 샘플을 골라 이 흐름을 체험할 수 있어요.');plantPicker(b,'',plantId=>{if(plantId){api.selectPlant(plantId);api.open(id,{plantId});}});actions(b,button('내 정원으로',()=>api.navigate('garden')));}
  function openObservation(id){api.selectPlant(id);api.navigate('today');}
  function originKey(context){return context.offer?.id?'offer:'+context.offer.id:context.plantId?'plant:'+context.plantId:'direct';}
  function newArrival(context){
    const plant=context.plantId?api.getPlant(context.plantId):null,offer=context.offer?.kind==='plant'?copy(context.offer):null;
    return {plantId:plant?.id||null,offer,saved:null,editing:false,form:{origin:offer?'purchase':'gift',name:plant?.name||offer?.name||'',location:plant?.location||'',type:validType(plant?.type||offer?.type),description:offer?[offer.size,offer.condition,offer.components].filter(Boolean).join(' · '):'',condition:'unknown',question:''}};
  }
  function arrivalSummary(d){const p=api.getPlant(d.plantId),s=d.saved;return [['대상',p?plantTitle(p):s.name||'이름 모를 식물'],['들인 경로',origins[s.origin]],['당시 설명',s.description||'확인한 설명 없음'],['수령 상태',arrivalStates[s.condition]],['확인할 점',s.question||'아직 정하지 않음']];}
  function renderArrival(host,context={}){
    start(host);const key=originKey(context);if(!arrivals.has(key))arrivals.set(key,newArrival(context));const d=arrivals.get(key);
    if(context.plantId&&!api.getPlant(context.plantId)){noPlant(host,'arrival');return;}
    const redraw=()=>renderArrival(host,context);
    const intro=box(host,'들인 날의 설명과 상태를 남겨요');text(intro,'구입·선물·개인 분양 모두 살펴볼 수 있어요. 사진을 선택하거나 건강을 판정하는 기능은 없어요.');
    if(d.offer){text(intro,'체험용 가상 매물에서 이어졌어요. 실제 구입이나 거래가 이루어진 것은 아니에요.','p-careflow-warning');details(intro,[['후보',d.offer.name],['판매처 예시',d.offer.seller||'판매처 미확인'],['당시 조건',[d.offer.size,d.offer.condition,d.offer.components].filter(Boolean).join(' · ')||'미확인']]);}
    if(d.saved&&!d.editing){
      const result=box(host,'입양 확인을 정리했어요');result.dataset.careflowResult='arrival';details(result,arrivalSummary(d));text(result,'이 확인과 연결한 식물은 현재 창에서만 유지돼요. 실제 검수·판매자 연락·영구 저장은 하지 않아요.');
      actions(result,button('이 식물 상태 살펴보기',()=>openObservation(d.plantId),true),button('입양 내용 수정',()=>{d.form=copy(d.saved);d.editing=true;redraw();focus(host.querySelector('[data-careflow-form] h2'));}));
      actions(result,button('입양 확인 취소',()=>{d.saved=null;d.editing=false;contextRows(d.plantId,'arrival',[]);redraw();feedback(host,'입양 확인만 취소했어요. 이미 등록한 식물과 관찰은 그대로예요.');}),button('내 정원으로',()=>api.navigate('garden')));
      if(key==='direct')actions(result,button('다른 식물 입양 확인',()=>{arrivals.delete('direct');redraw();focus(host.querySelector('h2'));}));return;
    }
    const form=box(host,d.plantId?'이 식물의 입양 확인':'새 식물 입양 확인');form.dataset.careflowForm='arrival';
    const existing=d.plantId?api.getPlant(d.plantId):null;
    if(existing)text(form,plantTitle(existing),'p-context p-small');
    field(form,'들인 경로','select',d.form.origin,v=>d.form.origin=v,{values:origins});
    if(!existing){field(form,'이름 또는 별명 · 선택','text',d.form.name,v=>d.form.name=v,{max:80,placeholder:'모르면 비워두기'});field(form,'놓인 곳 · 선택','text',d.form.location,v=>d.form.location=v,{max:100,placeholder:'예: 거실 창가 · 주소는 쓰지 마세요'});field(form,'재배 방식','select',d.form.type,v=>d.form.type=v,{values:types});}
    field(form,'당시 들은 설명 · 선택','textarea',d.form.description,v=>d.form.description=v,{max:500,placeholder:'예: 화분 포함, 뿌리 상태는 모름'});
    field(form,'설명과 지금 상태를 비교하면','select',d.form.condition,v=>d.form.condition=v,{values:arrivalStates});
    field(form,'다른 점이나 확인하고 싶은 점 · 선택','textarea',d.form.question,v=>d.form.question=v,{max:500,placeholder:'눈에 보이는 점과 아직 모르는 점을 적어 주세요'});
    text(form,'다른 점이 보여도 원인이나 판매자 책임을 확정하지 않아요. 판매자에게 물을 내용을 정리하는 체험이에요.','p-careflow-warning');
    const message=feedback(form);
    actions(form,button(existing?'입양 확인 반영':'입양 확인하고 내 식물에 추가',()=>{
      if(!d.plantId){const p=api.createPlant({name:clean(d.form.name)||'이름 모를 식물',location:clean(d.form.location)||'놓인 곳 모름',type:validType(d.form.type),origin:d.form.origin});if(!p?.id){message.textContent='식물을 연결하지 못했어요. 입력을 확인한 뒤 다시 눌러 주세요.';return;}d.plantId=p.id;}
      d.saved=copy(d.form);d.editing=false;arrivals.set('plant:'+d.plantId,d);api.selectPlant(d.plantId);contextRows(d.plantId,'arrival',arrivalSummary(d));redraw();focus(host.querySelector('[data-careflow-result] h2'));
    },true),button(d.saved?'수정 취소':'입양 입력 취소',()=>{
      if(d.saved){d.form=copy(d.saved);d.editing=false;redraw();return;}
      arrivals.delete(key);api.navigate('garden');
    }));
  }
  function blankPlan(){return {work:'other',action:'',next:'',date:'',progress:'unknown'};}
  function followupRows(record){return [['정리한 일',workLabels[record.work]],['한 일·상담 메모',record.action||'아직 적지 않음'],['다음 확인',record.next],['다시 볼 날짜',record.date||'아직 정하지 않음'],['내가 본 경과',progressLabels[record.progress]]];}
  function syncFollowup(plantId,d){const latest=d.records.filter(r=>!r.cancelled).at(-1);contextRows(plantId,'followup',latest?followupRows(latest):[]);}
  function renderFollowup(host,context={}){
    start(host);const id=selectedId(context),plant=id?api.getPlant(id):null;if(!plant){noPlant(host,'followup');return;}
    if(!followups.has(id))followups.set(id,{form:blankPlan(),editingId:null,records:[],notice:'',inquiryId:null});const d=followups.get(id),redraw=()=>renderFollowup(host,{plantId:id});
    const intro=box(host,'다음에 확인할 일을 정해요');plantPicker(intro,id,newId=>{if(newId){api.selectPlant(newId);api.open('followup',{plantId:newId});}});currentObservation(intro,plant);text(intro,'내가 한 일이나 들은 상담 내용을 직접 정리하는 시안이에요. 전문가 답변을 제공하거나 관리 주기를 정해주지는 않아요.');
    const form=box(host,d.editingId?'경과 기록 수정':'내 계획과 경과 남기기');form.dataset.careflowForm='followup';
    field(form,'어떤 일을 정리하나요?','select',d.form.work,v=>d.form.work=v,{values:workLabels});
    field(form,'실제로 한 일·직접 정리한 상담 내용 · 선택','textarea',d.form.action,v=>d.form.action=v,{max:500,placeholder:'아직 실행하지 않았다면 계획이라고 적어 주세요'});
    const next=field(form,'다음에 확인할 것','textarea',d.form.next,v=>d.form.next=v,{max:300,placeholder:'예: 같은 시간에 잎의 모습을 다시 살펴보기'});
    field(form,'내가 다시 볼 날짜 · 선택','date',d.form.date,v=>d.form.date=v,{note:'날짜를 정하지 않고 남겨도 돼요. 알림 발송이나 급수 권고는 하지 않아요.'});
    field(form,'내가 본 경과','select',d.form.progress,v=>d.form.progress=v,{values:progressLabels});const message=feedback(form,d.notice);
    actions(form,button(d.editingId?'수정 내용 반영':'경과 기록 남기기',()=>{
      if(!clean(d.form.next)){message.textContent='다음에 확인할 것을 적어 주세요. 모르면 “확인 방법을 더 알아보기”로 남겨도 돼요.';next.focus();return;}
      const value=copy(d.form);value.next=clean(value.next);value.action=clean(value.action);
      if(d.editingId){const record=d.records.find(r=>r.id===d.editingId&&!r.cancelled);if(!record){d.notice='수정할 기록을 다시 골라 주세요.';d.editingId=null;redraw();return;}Object.assign(record,value,{updatedAt:Date.now()});d.notice='같은 경과 기록을 수정했어요.';}
      else{d.records.push({...value,id:'care-plan-'+(++planId),createdAt:Date.now(),cancelled:false});d.notice='경과 기록을 남겼어요. 다음 행동과 날짜는 내가 정한 계획이에요.';}
      d.editingId=null;d.form=blankPlan();syncFollowup(id,d);redraw();focus(host.querySelector('[data-careflow-history] h2'));
    },true));
    if(d.editingId)actions(form,button('수정 취소',()=>{d.editingId=null;d.form=blankPlan();d.notice='수정을 취소했어요. 기존 경과는 그대로예요.';redraw();focus(host.querySelector('[data-careflow-history] h2'));}));
    const history=box(host,'이 식물의 경과 기록');history.dataset.careflowHistory='followup';

    const records=observations(id),recordOptions={'':'아직 고르지 않음'};records.slice().reverse().forEach(r=>{recordOptions[r.id]=observationText(r,plant.type)+' · '+timestamp(r.createdAt);});
    const recordField=field(sharing,'포함할 유효 관찰','select',f.observationId,v=>f.observationId=v,{values:recordOptions});recordField.disabled=!f.shareObservation||!records.length;
    let privateCheck;
    check(sharing,'선택한 관찰의 상태와 시각 포함',f.shareObservation,v=>{f.shareObservation=v;recordField.disabled=!v||!records.length;privateCheck.disabled=!v||!records.length;if(!v){f.sharePrivateNote=false;privateCheck.checked=false;}},!records.length);
    privateCheck=check(sharing,'선택한 관찰의 개인 메모도 포함',f.sharePrivateNote,v=>f.sharePrivateNote=v,!f.shareObservation||!records.length);
    check(sharing,'등록한 놓인 곳도 포함',f.shareLocation,v=>f.shareLocation=v);
    if(!records.length)text(sharing,'포함할 유효 관찰이 없어요. 관찰 없이 카드 내용을 정리해도 돼요.');
    const message=feedback(form);
    actions(form,button('내가 포함한 카드 미리보기',()=>{
      if(f.purpose==='판매 검토'&&!validMoney(price,f.price)){message.textContent='판매 희망 금액은 0원 이상 정수로 적거나 비워두세요.';price.focus();return;}
      if(!validMoney(shipping,f.shipping)){message.textContent='배송비는 0원 이상 정수로 적거나 미확인이면 비워두세요.';shipping.focus();return;}
      if(f.shareObservation&&!observations(id).some(r=>r.id===f.observationId)){message.textContent='포함할 유효 관찰을 고르거나 관찰 포함을 해제해 주세요.';recordField.focus();return;}
      d.preview=true;redraw();focus(host.querySelector('[data-careflow-preview] h2'));
    },true),button('내 정원으로',()=>api.navigate('garden')));
  }
  function blankMaterial(){return {preview:false,form:{name:'',amount:'',unit:'unknown',opened:'unknown',storage:'',purpose:'free',price:'',shipping:'',method:'unknown',region:'',condition:'',question:''}};}
  function renderMaterialTransfer(host,context={}){
    start(host);const key=context.materialId||context.offer?.id||'direct';if(!materialTransfers.has(key))materialTransfers.set(key,blankMaterial());const d=materialTransfers.get(key),f=d.form,redraw=()=>renderMaterialTransfer(host,context);
    const units={unknown:'단위 모름',L:'L',kg:'kg',g:'g','개':'개','봉':'봉'},openedLabels={unknown:'모름',unopened:'미개봉',opened:'개봉함'};
    const intro=box(host,'남은 원예자재를 설명해요');text(intro,'개인 간 소량 구매·나눔을 준비하는 카드 예시예요. 식물을 등록하지 않아도 작성할 수 있고, 게시하거나 거래를 연결하지 않아요.');text(intro,'남은 양·개봉·보관 상태를 아는 만큼 적어요. 이 카드가 재사용 안전이나 품질을 확인해 주지는 않아요.','p-careflow-warning');
    if(d.preview){
      const card=box(host,'자재 구매·나눔 카드 미리보기');card.dataset.careflowPreview='material';text(card,'공개·발행되지 않은 체험용 카드','p-careflow-tag');
      details(card,[['품목',clean(f.name)],['남은 양',f.amount?(f.amount+' '+(f.unit==='unknown'?'단위 미확인':units[f.unit])):'양 미확인'],['개봉 여부',openedLabels[f.opened]],['알고 있는 보관 상태',clean(f.storage)||'모름'],['거래 구상',f.purpose==='free'?'무료 나눔':'유료 소량 판매'],['수령 방식',methodLabels[f.method]],...offerCosts(f.purpose,f.price,f.shipping,f.method),['넓은 거래 지역',clean(f.region)||'아직 정하지 않음'],['상태·조건',clean(f.condition)||'추가 확인 전'],['먼저 확인할 질문',clean(f.question)||'아직 정하지 않음']]);
      text(card,'사진·연락처·집 주소는 받지 않았어요. 배송비·수령 장소·현재 상태는 실제 거래 전에 별도로 확인할 사항이에요.');
      actions(card,button('카드 내용 수정',()=>{d.preview=false;redraw();focus(host.querySelector('[data-careflow-form] h2'));},true),button('새 자재 카드 작성',()=>{materialTransfers.delete(key);redraw();focus(host.querySelector('[data-careflow-form] h2'));}));actions(card,button('내 정원으로',()=>api.navigate('garden')));return;
    }
    const form=box(host,'어떤 자재가 남았나요?');form.dataset.careflowForm='material';
    const name=field(form,'품목 이름','text',f.name,v=>f.name=v,{max:100,placeholder:'예: 남은 펄라이트 · 정확한 제품명은 모름'});
    const amount=field(form,'남은 양 · 모르면 비워두기','number',f.amount,v=>f.amount=v,{placeholder:'예: 2'});amount.min='0';amount.step='any';
    field(form,'양의 단위','select',f.unit,v=>f.unit=v,{values:units,note:'서로 다른 단위는 임의로 바꾸지 않아요. 봉 단위라면 한 봉의 용량을 상태·조건에 적어 주세요.'});
    field(form,'개봉 여부','select',f.opened,v=>f.opened=v,{values:openedLabels});
    field(form,'알고 있는 보관 상태 · 선택','textarea',f.storage,v=>f.storage=v,{max:300,placeholder:'예: 개봉 날짜는 모름, 실내 보관 · 모르면 비워두기'});
    let price;
    field(form,'판매 또는 나눔','select',f.purpose,v=>{f.purpose=v;price.disabled=v==='free';},{values:{free:'무료 나눔',paid:'유료 소량 판매'}});
    price=field(form,'희망 금액 · 유료일 때 선택','number',f.price,v=>f.price=v,{placeholder:'금액 미정이면 비워두기',note:'거래가가 아닌 희망 금액이에요. 배송비·수령 비용은 포함하지 않아요.'});price.min='0';price.step='1';price.disabled=f.purpose==='free';
    field(form,'수령 방식','select',f.method,v=>f.method=v,{values:methodLabels});
    const shipping=moneyInput(form,'배송비 · 선택',f.shipping,v=>f.shipping=v,'무료 나눔도 수령 비용은 별도예요. 배송비 미확인 상태를 무료 배송으로 표시하지 않아요.');
    field(form,'넓은 거래 지역 · 선택','text',f.region,v=>f.region=v,{max:60,placeholder:'예: 서울 마포구 · 상세 주소는 쓰지 마세요'});
    field(form,'확인한 상태·수령 조건 · 선택','textarea',f.condition,v=>f.condition=v,{max:400,placeholder:'예: 포장 상태, 확인하지 못한 부분 · 연락처·주소 제외'});
    field(form,'거래 전 확인하고 싶은 질문 · 선택','textarea',f.question,v=>f.question=v,{max:300,placeholder:'예: 실제 잔량이나 수령 방법을 더 확인하고 싶어요'});
    const message=feedback(form);
    actions(form,button('자재 카드 미리보기',()=>{
      if(!clean(f.name)){message.textContent='어떤 자재인지 품목 이름을 적어 주세요.';name.focus();return;}
      if(amount.validity.badInput||(f.amount&&(!Number.isFinite(Number(f.amount))||Number(f.amount)<=0))){message.textContent='남은 양은 0보다 큰 수로 적거나, 모르면 비워두세요.';amount.focus();return;}
      if(f.purpose==='paid'&&!validMoney(price,f.price)){message.textContent='희망 금액은 0원 이상 정수로 적거나, 미정이면 비워두세요.';price.focus();return;}
      if(!validMoney(shipping,f.shipping)){message.textContent='배송비는 0원 이상 정수로 적거나 미확인이면 비워두세요.';shipping.focus();return;}
      d.preview=true;redraw();focus(host.querySelector('[data-careflow-preview] h2'));
    },true),button('작성 취소',()=>{materialTransfers.delete(key);api.navigate('garden');}));
  }
  api.registerView('arrival',{title:'들인 식물 확인하기',subtitle:'당시 설명과 지금 보이는 상태를 함께 남겨요.',nav:'garden',render:renderArrival});
  api.registerView('followup',{title:'다음 관찰을 이어가요',subtitle:'내가 정한 계획과 실제 경과를 구분해요.',nav:'today',render:renderFollowup});
  api.registerView('cases',{title:'조건을 함께 보는 사례',subtitle:'가상의 관찰 기록으로 내 상황을 비교해요.',nav:'cases',render:renderCases});
  api.registerView('transfer',{title:'판매·분양 카드 준비',subtitle:'보여줄 내용과 제외할 기록을 직접 골라요.',nav:'garden',render:renderTransfer});
})();
</script>
